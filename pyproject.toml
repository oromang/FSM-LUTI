[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsm-luti"
version = "0.1.0"
description = "Standalone regional FSM with optional calibrated HARMONY allocation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "scipy>=1.14", "pandas>=2.2", "pyarrow>=18", "geopandas>=1.0", "pyogrio>=0.10", "h5py>=3.12", "openpyxl>=3.1", "requests>=2.32", "matplotlib>=3.9"]

[project.scripts]
fsm-luti = "fsm_luti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
